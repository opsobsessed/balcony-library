<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg"><title>The Balcony Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balcony Library">
<meta name="theme-color" content="#f7ece0">
<style>
/* Layout: one phone-width column. A painted balcony band (sky, sea, curtains, railing) sits on top;
   the dark wood bookcase and the tea table float up over it; three tabs live in a floating pill. */
:root{
  --paper:#f7ece0; --paper-2:#f0e1d1; --card:#fff8ef; --line:#e2cdb8;
  --ink:#2a1f1a; --ink-2:#64544b; --ink-3:#8f7f74;
  --terra:#a8492f; --terra-soft:#f6d3bf; --sage:#6f8668; --sage-soft:#dfe7d6;
  --wood:#2a130c; --wood-2:#4a2416; --wood-hi:#7a3f26; --brass:#d8b77c; --brass-ink:#3d2a17;
  --sky-top:#8fb3d4; --sky-mid:#f3cfae; --sky-bot:#fbe2c3; --sun:#fff1cf; --sea:#88a9b5; --sea-deep:#4d7385; --glint:rgba(255,255,255,.55); --city:#7d8b9a; --road:#c9c2b8; --tree:#5f7a55;
  --curtain:rgba(255,251,243,.82); --curtain-fold:rgba(214,198,178,.5); --rail:#efe4d3; --rail-shadow:rgba(60,40,25,.25);
  --glow:rgba(255,200,140,.10); --shadow:rgba(44,30,22,.16);
  --f-display:"Vollkorn", "Iowan Old Style", Georgia, serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-stamp:"Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme:light;
}
:root[data-tod="morning"]{ --sky-top:#b9d3e4; --sky-mid:#f6e1cc; --sky-bot:#fdeedd; --sun:#fff6e2; --sea:#9ab9c3; --sea-deep:#5a8292; --city:#9aa6b2; }
:root[data-tod="golden"]{ --sky-top:#47679a; --sky-mid:#e79a6a; --sky-bot:#f6ae55; --sun:#ffd27a; --sea:#c98b62; --sea-deep:#5b5468; --glint:rgba(255,214,150,.75); --glow:rgba(255,170,90,.20); --city:#4c4a5a; --road:#8f8079; --tree:#3f4a35; }
:root[data-tod="night"], :root[data-theme="dark"]{
  --paper:#1d1916; --paper-2:#26201b; --card:#2b241e; --line:#40362d;
  --ink:#f1e7d8; --ink-2:#c8b9a8; --ink-3:#998878;
  --terra:#e09a85; --terra-soft:#4a2c25; --sage:#a9c09f; --sage-soft:#2c3529;
  --wood:#170a06; --wood-2:#2a140c; --wood-hi:#5a2e1c; --brass:#d8b77c; --brass-ink:#2a1d10;
  --sky-top:#101a2c; --sky-mid:#2a3550; --sky-bot:#3a3a52; --sun:#e9e4d2; --sea:#25374a; --sea-deep:#141f2c; --glint:rgba(255,214,150,.45); --city:#1c2230; --road:#2a2a33; --tree:#18201a;
  --curtain:rgba(214,206,190,.30); --curtain-fold:rgba(20,16,12,.35); --rail:#3a332c; --rail-shadow:rgba(0,0,0,.4);
  --glow:rgba(255,190,110,.06); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1d1916; --paper-2:#26201b; --card:#2b241e; --line:#40362d;
  --ink:#f1e7d8; --ink-2:#c8b9a8; --ink-3:#998878;
  --terra:#e09a85; --terra-soft:#4a2c25; --sage:#a9c09f; --sage-soft:#2c3529;
  --wood:#170a06; --wood-2:#2a140c; --wood-hi:#5a2e1c; --brass:#d8b77c; --brass-ink:#2a1d10;
  --sky-top:#101a2c; --sky-mid:#2a3550; --sky-bot:#3a3a52; --sun:#e9e4d2; --sea:#25374a; --sea-deep:#141f2c; --glint:rgba(255,214,150,.45); --city:#1c2230; --road:#2a2a33; --tree:#18201a;
  --curtain:rgba(214,206,190,.30); --curtain-fold:rgba(20,16,12,.35); --rail:#3a332c; --rail-shadow:rgba(0,0,0,.4);
  --glow:rgba(255,190,110,.06); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root.ritual{ --glow:rgba(255,190,120,.28); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.2}
.stamp{font-family:var(--f-stamp);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.app{max-width:460px;margin:0 auto;min-height:100%;position:relative;z-index:1;padding-bottom:110px}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 85% 10%, var(--glow), transparent 70%);transition:background 1.2s ease;z-index:40}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:color-mix(in srgb, var(--paper) 62%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand .stamp{color:var(--ink-3);font-size:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--paper-2)}
.iconbtn svg{width:21px;height:21px}

/* ---------- balcony scene ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 32%,var(--sky-bot) 40%)}
.clouds{position:absolute;inset:0 0 62% 0;background:radial-gradient(40% 18% at 30% 30%,color-mix(in srgb,var(--sky-mid) 60%,#fff) ,transparent 70%),radial-gradient(35% 14% at 72% 22%,color-mix(in srgb,var(--sky-mid) 70%,#fff),transparent 70%),radial-gradient(30% 10% at 55% 44%,color-mix(in srgb,var(--sky-top) 70%,var(--sky-mid)),transparent 70%);opacity:.55;animation:drift 40s ease-in-out infinite alternate}
.sun{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--sun);right:24%;top:calc(40% - 22px);box-shadow:0 0 40px 22px color-mix(in srgb,var(--sun) 60%, transparent)}
.sea{position:absolute;left:0;right:0;top:40%;bottom:0;background:linear-gradient(180deg,var(--sea),var(--sea-deep))}
.sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 6px,var(--glint) 6px 7px,transparent 7px 13px);opacity:.35;mask:linear-gradient(90deg,transparent 30%,#000 60%,#000 90%,transparent);-webkit-mask:linear-gradient(90deg,transparent 30%,#000 60%,#000 90%,transparent);animation:shimmer 9s ease-in-out infinite alternate}
.sea::after{content:"";position:absolute;left:76%;top:0;width:70px;height:100%;transform:translateX(-50%);background:linear-gradient(180deg,var(--glint),transparent 85%);opacity:.6;filter:blur(5px)}
.coast{position:absolute;left:0;width:max(100vw,560px);height:auto;aspect-ratio:400/140;top:calc(40% - max(100vw,560px) * .105)}
.coast .city{fill:var(--city)}
.coast .road{fill:var(--road)}
.coast .tree{fill:var(--tree)}
.coast .lamp{fill:#ffd9a0;opacity:0}
:root[data-tod="night"] .coast .lamp,:root[data-theme="dark"] .coast .lamp{opacity:.95}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .coast .lamp{opacity:.95}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
.rail{position:absolute;left:0;right:0;bottom:0;height:13vh}
.rail::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--rail);box-shadow:0 3px 6px var(--rail-shadow)}
.rail::after{content:"";position:absolute;left:0;right:0;top:9px;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 22px,var(--rail) 22px 28px);opacity:.92}
.curtain{position:absolute;top:-6px;bottom:-10px;width:min(22%,180px);background:repeating-linear-gradient(90deg,var(--curtain) 0 14px,var(--curtain-fold) 14px 16px,var(--curtain) 16px 30px);transform-origin:top center;filter:blur(.3px)}
.curtain.l{left:-4%;border-radius:0 0 60% 0/0 0 18% 0;animation:sway 7s ease-in-out infinite}
.curtain.r{right:-4%;border-radius:0 0 0 60%/0 0 0 18%;animation:sway 8.5s ease-in-out -2s infinite reverse}
.timechip{position:relative;margin:4px 16px 0;width:max-content;display:flex;gap:6px;align-items:center;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.timechip svg{width:13px;height:13px;color:var(--terra)}
@keyframes sway{0%,100%{transform:skewX(0deg) translateX(0)}50%{transform:skewX(-2.4deg) translateX(5px)}}
@keyframes shimmer{from{transform:translateY(0)}to{transform:translateY(5px)}}
.paused *, .paused *::before, .paused *::after{animation-play-state:paused!important}

.stage{position:relative;z-index:2;margin-top:clamp(120px,24vh,220px);padding-inline:14px;display:flex;flex-direction:column;gap:16px}

/* ---------- bookcase ---------- */
.case{border-radius:10px;padding:14px 12px 12px;color:#f3e7d6;background:linear-gradient(180deg,var(--wood-2),var(--wood) 70%);box-shadow:inset 0 0 36px rgba(0,0,0,.65),0 10px 26px var(--shadow);border:1px solid #4a2e17;display:flex;flex-direction:column;gap:12px}
.casehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.casehead .stamp{color:var(--brass)}
.yearpick{display:flex;align-items:center;gap:2px;color:var(--brass)}
.yearpick button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--brass)}
.yearpick button:disabled{opacity:.25;cursor:default}
.yearpick button svg{width:15px;height:15px}
.yearpick span{font-family:var(--f-stamp);font-weight:700;font-size:13px;letter-spacing:.06em}
.bay{border-radius:5px;padding:8px 8px 0;background:linear-gradient(180deg,#120b07,#1d130c 80%,#0c0603);box-shadow:inset 0 9px 16px rgba(0,0,0,.75)}
.bayhead{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px}
.plate{display:inline-flex;gap:6px;align-items:center;padding:2px 9px;border-radius:3px;background:linear-gradient(180deg,#6a4b2a,#3f2b17);border:1px solid #a88a52;color:var(--brass);font-family:var(--f-stamp);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.plate::before,.plate::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--brass)}
button.plate{cursor:pointer}
.count{font-size:12px;color:#c9b8a6;font-style:italic}
.row{display:flex;align-items:flex-end;gap:4px;min-height:104px;overflow-x:auto;padding:10px 4px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.plank{height:10px;margin:0 -8px;border-radius:2px;background:linear-gradient(180deg,#6a4529,#3a2314);box-shadow:0 3px 6px rgba(0,0,0,.6)}
.tier{display:grid;grid-template-columns:1fr 92px;gap:8px}
.tier>div{min-width:0}
.spine{flex:0 0 auto;position:relative;border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 2px 6px;box-shadow:2px 0 5px rgba(0,0,0,.4),inset 1px 0 0 rgba(255,255,255,.14),inset -2px 0 0 rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.2,.8,.2,1);transform-origin:bottom center}
.spine:hover{transform:translateY(-4px)}
.spine.pulling{transform:translateY(-22px) rotate(-4deg);box-shadow:4px 8px 14px rgba(0,0,0,.6)}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-stamp);font-weight:700;font-size:9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(100% - 14px)}
.spine .band{width:60%;height:2px;background:currentColor;opacity:.55}
.spine.reread::after{content:"";position:absolute;top:4px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--brass)}
.spine.arrive{animation:arrive .9s cubic-bezier(.2,.9,.25,1.15)}
@keyframes arrive{0%{transform:translateY(-70px) rotate(8deg);opacity:0}60%{opacity:1}100%{transform:none}}
.aside-nook{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:104px;padding-top:10px}
.flat{width:100%;height:20px;border-radius:2px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-family:var(--f-stamp);font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;box-shadow:1px 2px 5px rgba(0,0,0,.45);transform:rotate(-1deg)}
.flat span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ghost{border:1px dashed rgba(216,183,124,.35);border-radius:3px;color:#a89580;font-size:12px;font-style:italic;display:grid;place-items:center;text-align:center;padding:6px}
.row .ghost{width:100%;height:84px;margin-bottom:2px}
.empty-months{color:#b9a693;font-size:13px;font-style:italic;text-align:center;padding:4px 8px 2px}

/* ---------- table ---------- */
.table{position:relative;border-radius:16px;background:var(--card);box-shadow:0 2px 14px var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.table::before{content:"";position:absolute;inset:-20% -30% auto auto;width:75%;height:160%;background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--sun) 55%,transparent) 50%,transparent 70%);opacity:.5;transform:rotate(8deg);pointer-events:none}
.table::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--terra-soft);opacity:.5;filter:blur(30px);pointer-events:none}
.tablehead{position:relative;display:flex;justify-content:space-between;align-items:center}
.tablehead h2{font-size:18px;font-weight:600}
.tea{position:relative;width:38px;height:34px;flex:none}
.tea .cup{position:absolute;left:4px;bottom:3px;width:24px;height:17px;border-radius:2px 2px 10px 10px;background:var(--terra)}
.tea .cup::after{content:"";position:absolute;right:-7px;top:3px;width:7px;height:8px;border:2.5px solid var(--terra);border-left:0;border-radius:0 6px 6px 0}
.tea .saucer{position:absolute;left:0;bottom:0;width:32px;height:4px;border-radius:50%;background:var(--ink-3);opacity:.6}
.tea i{position:absolute;bottom:20px;width:3px;height:12px;border-radius:3px;background:var(--ink-3);opacity:0;animation:steam 3.2s ease-in-out infinite}
.tea i:nth-child(1){left:9px}.tea i:nth-child(2){left:15px;animation-delay:1.1s}.tea i:nth-child(3){left:21px;animation-delay:2.1s}
.tea.cold i{display:none}
@keyframes steam{0%{opacity:0;transform:translateY(4px) scaleY(.6)}35%{opacity:.45}100%{opacity:0;transform:translateY(-12px) translateX(3px) scaleY(1.2)}}
.inhand{position:relative;display:flex;gap:14px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--paper);text-align:left;width:100%}
.inhand .ribbon{position:absolute;top:-6px;right:22px;width:12px;height:40px;background:var(--sage);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.inhand .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.inhand h3{font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.inhand .by{font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:3px 8px;border-radius:5px;background:var(--paper-2);font-family:var(--f-stamp);font-size:11px;color:var(--ink-2);width:max-content;max-width:100%}
.chip b{color:var(--terra)}
.cta{width:100%;padding:13px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.01em;display:flex;gap:8px;justify-content:center;align-items:center;box-shadow:0 4px 12px var(--shadow);transition:transform .15s, background .3s}
.cta:active{transform:scale(.98)}
.cta.done{background:var(--sage);color:#fff}
.hint{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:-6px}
.slip{background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:4px;padding:14px 16px;box-shadow:0 1px 6px var(--shadow);transform:rotate(-.6deg);display:flex;flex-direction:column;gap:4px}
.slip .stamp{color:var(--terra)}
.slip p{margin:0;font-style:italic}

/* ---------- covers ---------- */
.cover{position:relative;flex:none;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 3px 10px var(--shadow),inset 3px 0 0 rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-between;padding:10% 9%;color:#fbf3e6}
.cover .ct{font-family:var(--f-display);font-weight:600;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.cover .ca{font-family:var(--f-stamp);text-transform:uppercase;letter-spacing:.05em;opacity:.85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover::before{content:"";position:absolute;inset:6%;border:1px solid currentColor;opacity:.3;border-radius:2px;pointer-events:none}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv-s{width:58px;height:86px}.cv-s .ct{font-size:10px}.cv-s .ca{font-size:6px}
.cv-m{width:76px;height:112px}.cv-m .ct{font-size:12.5px}.cv-m .ca{font-size:7px}
.cv-l{width:132px;height:196px}.cv-l .ct{font-size:19px}.cv-l .ca{font-size:9px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(25,16,10,.38);z-index:60;opacity:0;transition:opacity .25s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(460px,100%);max-height:88vh;overflow-y:auto;transform:translate(-50%,100%);z-index:61;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px var(--shadow);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:23px}
.sheet .sub{color:var(--ink-2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.center{align-items:center;text-align:center}
.btn{padding:12px 16px;border-radius:999px;font-weight:600;font-size:15px;text-align:center;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);font-weight:500}
.btn.small{padding:7px 12px;font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:600;font-size:14px}
.action svg{width:20px;height:20px;color:var(--terra)}
.action small{font-weight:400;color:var(--ink-2);font-size:12px;line-height:1.35}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--f-stamp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);resize:vertical}
.field textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.why-slip{position:relative;background:#fbf4e4;color:#3a2b20;padding:12px 14px 12px 18px;border-radius:2px;box-shadow:0 2px 8px var(--shadow);transform:rotate(1.2deg);font-style:italic;max-width:300px;text-align:left}
.why-slip::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:1px;background:#d9a49a}
.why-slip .stamp{display:block;font-style:normal;color:#9c4a3b;margin-bottom:2px;font-size:10px}

/* book card */
.bc-head{display:flex;gap:16px;align-items:flex-end}
.bc-head .meta{min-width:0}
.bc-head h2{font-size:24px;overflow-wrap:anywhere}

<script>
(() => {
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);

const ICON = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  quote:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 18c2.5-1 4-3.4 4-6.5V6H4v6h3c0 2-1 3.5-2.5 4.2L5 18Zm10 0c2.5-1 4-3.4 4-6.5V6h-5v6h3c0 2-1 3.5-2.5 4.2L15 18Z"/></svg>',

};

/* ================= state ================= */
const S = { books: [], tab: "library", year: new Date().getFullYear(), cal: { y: new Date().getFullYear(), m: new Date().getMonth() }, sample: false, results: null, query: "", source: "", searching: false, searchError: "", lastArrive: null };

/* ================= time of day ================= */
function setTod() {
  const h = new Date().getHours();
  const tod = (h >= 19 || h < 6) ? "night" : h < 11 ? "morning" : h < 16 ? "afternoon" : "golden";

  return tod;
}

/* ================= storage ================= */
const LS = "balcony-library-v1";
const local = {

  mode: "local", col: null, chains: {},

    const cached = local.read();
    if (cached) S.books = cached;
    const [db, user] = await Promise.all([use("db"), use("user")]);
    if (!db || !user) return;
    let id = null; try { id = await user.id(); } catch {}

      const snap = await this.col.get();
      const remote = snap.docs.filter(d => d.exists).map(d => d.data()).filter(b => b && b.id);

    if (this.mode !== "db") return;

/* ================= book model ================= */
function newBook(info, status) {

}

  const ys = new Set([new Date().getFullYear()]);
  S.books.forEach(b => b.readings.forEach(r => r.end && ys.add(parse(r.end).getFullYear())));

/* ================= sample books (not saved) ================= */
function sampleBooks() {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();

    mk("Stoner","John Williams",288,"finished",[{start:d(m,1),end:d(m,6),days:days(d(m,1),d(m,6)),closing:"Quiet and devastating."}],"#5c544d"),
    mk("Siddhartha","Hermann Hesse",152,"finished",[{start:d(m-1,2),end:d(m-1,9),days:days(d(m-1,2),d(m-1,9)),closing:"Read it on the train."}],"#b9ab95"),
    mk("Pedro Páramo","Juan Rulfo",124,"finished",[{start:d(m-1,14),end:d(m-1,20),days:days(d(m-1,14),d(m-1,20)),closing:""}],"#a4513f"),
    mk("The Waves","Virginia Woolf",297,"finished",[{start:d(m-1,21),end:d(m-1,30),days:days(d(m-1,21),d(m-1,30)),closing:""}],"#33504a")
  ];
}

/* ================= covers & spines ================= */
function coverHTML(b, size) {
  const c = colorOf(b), ink = inkOn(c);
  const img = b.thumb ? `<img src="${esc(b.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  return `<div class="cover cv-${size}" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 78%,#000));color:${ink}"><span class="ct">${esc(b.title)}</span><span class="ca">${esc(authorStr(b))}</span>${img}</div>`;
}
function spineHTML(b, opts = {}) {
  const c = colorOf(b), ink = inkOn(c);
  const w = Math.round(Math.min(38, Math.max(19, (b.pages || 280) / 13)));
  const h = 74 + (hash(b.title) % 22);
  const cls = ["spine"]; if (opts.reread) cls.push("reread"); if (opts.arrive) cls.push("arrive");
  return `<button class="${cls.join(" ")}" data-spine="${b.id}" data-kind="${opts.kind || ""}" ${opts.ri != null ? `data-ri="${opts.ri}"` : ""} style="width:${w}px;height:${h}px;background:${c};color:${ink}" aria-label="${esc(b.title)}"><span class="t">${esc(b.title)}</span><span class="band"></span></button>`;
}

/* ================= views ================= */
const view = $("#view");
function render() {
  document.querySelectorAll(".nav button").forEach(n => n.setAttribute("aria-current", n.dataset.tab === S.tab ? "page" : "false"));
  const tod = setTod();
  $("#subline").textContent = S.sample ? "Sample shelf · not saved" : (store.mode === "db" ? "Private · saved to your account" : "Private · saved on this phone");
  if (S.tab === "library") view.innerHTML = libraryHTML(tod);
  else if (S.tab === "log") view.innerHTML = logHTML();
  else view.innerHTML = searchHTML();
  S.lastArrive = null;
}

function libraryHTML(tod) {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const want = byStatus("want"), aside = byStatus("aside"), reading = byStatus("reading");
  const fin = finishedIn(S.year);
  const ys = years(), yi = ys.indexOf(S.year);
  const byMonth = {};
  fin.forEach(x => { const m = parse(x.r.end).getMonth(); (byMonth[m] = byMonth[m] || []).push(x); });
  const thisYear = S.year === now.getFullYear();
  const months = Object.keys(byMonth).map(Number);
  if (thisYear && !months.includes(now.getMonth())) months.push(now.getMonth());
  months.sort((a,b) => b - a);

  const monthBays = months.map(m => {
    const list = byMonth[m] || [];
    const spines = list.map(x => spineHTML(x.b, { kind: "fin", ri: x.i, reread: x.i > 0, arrive: S.lastArrive === x.b.id + ":" + x.i })).join("");
    return `<div class="bay"><div class="bayhead"><button class="plate" data-month="${m}">${MONTH[m]}</button><span class="count">${list.length ? list.length + (list.length === 1 ? " book" : " books") : "Room for more"}</span></div>
      <div class="row">${spines || `<div class="ghost">Finished books land here</div>`}</div><div class="plank"></div></div>`;
  }).join("");

  const tableBooks = reading.map(b => {
    const r = cur(b); const dayN = r ? diff(r.start, today()) + 1 : 1;
    const loggedToday = r && r.days.some(d => d.date === today());
    return `<button class="inhand" data-current="${b.id}"><span class="ribbon"></span>${coverHTML(b, "m")}
      <span class="meta"><span class="stamp" style="color:var(--terra)">${b.readings.length > 1 ? "Reading again" : "Currently in hand"}</span><h3>${esc(b.title)}</h3><span class="by">${esc(authorStr(b))}</span>
      <span class="chip">Started ${fmt(r.start)} · <b>Day ${dayN}</b>${loggedToday ? " · read today" : ""}</span></span></button>`;
  }).join("");
  const anyToday = reading.some(b => { const r = cur(b); return r && r.days.some(d => d.date === today()); });

  const latestQuote = S.books.flatMap(b => b.quotes.map(q => ({ ...q, b }))).sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const slip = latestQuote
    ? `<div class="slip"><span class="stamp">From your quotes · ${esc(latestQuote.b.title)}</span><p>“${esc(latestQuote.text)}”</p></div>`
    : `<div class="slip"><span class="stamp">How it works</span><p>Tap a spine to pull it off the shelf. Tap the book on the table to log a day, keep a quote, or finish it.</p></div>`;

  return `
  <div class="timechip">${tod === "night" ? ICON.moon : ICON.sun}<span class="stamp" style="font-weight:700">${esc(time)} · Marine Drive</span></div>
  ${S.sample ? `<div class="banner" style="position:relative;z-index:3"><span>You're looking at sample books. Nothing here is saved.</span><button data-act="clear-sample">Start my shelf</button></div>` : ""}
  <div class="stage">
    <section class="case" aria-label="Bookcase">
      <div class="casehead"><span class="stamp">My bookcase</span>
        <div class="yearpick"><button data-year="${ys[yi-1] ?? ""}" ${yi > 0 ? "" : "disabled"} aria-label="Previous year">${ICON.left}</button><span>${S.year}</span><button data-year="${ys[yi+1] ?? ""}" ${yi < ys.length - 1 ? "" : "disabled"} aria-label="Next year">${ICON.right}</button></div></div>
      <div class="bay"><div class="tier">
        <div><div class="bayhead"><span class="plate">Want to read</span><span class="count">${want.length}</span></div>
          <div class="row">${want.map(b => spineHTML(b, { kind: "want" })).join("") || `<div class="ghost">Add books you want to read</div>`}</div></div>
        <div><div class="bayhead"><span class="plate" style="letter-spacing:.08em">Set aside</span></div>
          <div class="aside-nook">${aside.slice(0,4).map(b => { const c = colorOf(b); return `<button class="flat" data-spine="${b.id}" data-kind="aside" style="background:${c};color:${inkOn(c)}"><span>${esc(b.title)}</span></button>`; }).join("") || `<div class="ghost" style="height:84px">Paused books rest here</div>`}</div></div>
      </div><div class="plank"></div></div>
      ${monthBays || `<div class="empty-months">No books finished in ${S.year}.</div>`}
    </section>

    <section class="table" aria-label="Tea table">
      <div class="tablehead"><h2>On the table</h2><div class="tea ${tod === "night" ? "cold" : ""}" aria-hidden="true"><i></i><i></i><i></i><span class="cup"></span><span class="saucer"></span></div></div>
      ${tableBooks || `<div class="ghost" style="color:var(--ink-2);border-color:var(--line);padding:22px;font-size:14px">Nothing on the table yet. Pull a book from your Want to read shelf, or add one.</div>`}
      ${reading.length ? `<button class="cta ${anyToday ? "done" : ""}" data-act="read-today">${anyToday ? ICON.check.replace('<svg','<svg width="18" height="18"') + " Read today · logged" : "✦ I read today"}</button>
        <p class="hint">${anyToday ? "Tap again to change today's entry." : "One tap adds today to your reading log."}</p>`
        : `<button class="cta" data-act="go-search">Find a book</button>`}
      ${!S.books.length && !S.sample ? `<button class="btn quiet" data-act="sample">See it with sample books first</button>` : ""}
    </section>
    ${slip}
  </div>`;
}

function searchHTML() {
  let body = "";
  if (S.searching) body = `<div class="loading" aria-label="Searching"><i></i><i></i><i></i></div>`;
  else if (S.searchError) body = `<div class="notice">${esc(S.searchError)}</div>`;
  else if (S.results) {
    body = S.results.length ? S.results.map((r, i) => {
      const owned = S.books.find(b => (r.gid && b.gid === r.gid) || (b.title.toLowerCase() === r.title.toLowerCase() && authorStr(b) === authorStr(r)));
      const facts = [r.year, r.pages ? r.pages + " pages" : null].filter(Boolean).join(" · ");
      return `<article class="result">${coverHTML({ ...r, color: null }, "s")}
        <div class="meta"><h3>${esc(r.title)}</h3><span class="muted" style="font-size:13px">${esc(authorStr(r))}</span>${facts ? `<span class="facts">${esc(facts)}</span>` : ""}
        ${r.blurb ? `<span class="blurb">${esc(r.blurb)}</span>` : ""}
        ${owned ? `<span class="added">Already in your library · ${owned.status === "finished" ? "finished" : owned.status === "reading" ? "on the table" : owned.status === "aside" ? "set aside" : "want to read"}</span>`
          : `<div class="btns"><button class="btn small" data-add="${i}" data-as="want">Add to Want to Read</button><button class="btn small primary" data-add="${i}" data-as="reading">Start reading</button></div>`}
        </div></article>`;
    }).join("") + (S.source ? `<p class="source">${esc(S.source)}</p>` : "")
    : `<div class="notice">No books matched “${esc(S.query)}”. Try the author's name, or add it by hand below.</div>`;
  } else {
    body = `<div class="slip" style="transform:none"><span class="stamp">Tip</span><p>Search by title, author, or both. “Ishiguro remains” works.</p></div>`;
  }
  return `<div class="page">
    <h2>Add a book</h2>
    <form class="searchbar" id="searchForm" role="search">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>'}
      <input id="q" type="search" placeholder="Search for a book" value="${esc(S.query)}" autocomplete="off" enterkeyhint="search"><button class="btn small primary" type="submit">Search</button></form>
    ${body}
    <button class="btn quiet" data-act="manual">Can't find it? Add it by hand</button>
  </div>`;
}

function logHTML() {
  const { y, m } = S.cal;
  const first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday first
  const t = today();
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<div class="day blank"></div>`;
  let daysRead = 0; const seen = new Map();
  for (let d = 1; d <= dim; d++) {
    const ds = iso(new Date(y, m, d));
    const items = readOn(ds);
    if (items.length) daysRead++;
    items.forEach(x => seen.set(x.b.id, x.b));
    const bars = items.slice(0,4).map(x => `<i style="background:${colorOf(x.b)}"></i>`).join("");
    cells += `<button class="day ${ds === t ? "today" : ""} ${ds > t ? "future" : ""}" data-day="${ds}" ${ds > t ? "disabled" : ""} aria-label="${d} ${MONTH[m]}${items.length ? ", read " + items.map(x => x.b.title).join(", ") : ""}"><span class="n">${d}</span><span class="bars">${bars}</span></button>`;
  }
  const finishedCount = S.books.reduce((n, b) => n + b.readings.filter(r => r.end && parse(r.end).getFullYear() === y && parse(r.end).getMonth() === m).length, 0);
  const isNow = y === new Date().getFullYear() && m === new Date().getMonth();
  return `<div class="page">
    <div class="monthnav"><button class="iconbtn" data-cal="-1" aria-label="Previous month">${ICON.left}</button><h2>${MONTH[m]} <span class="muted" style="font-size:18px">${y}</span></h2><button class="iconbtn" data-cal="1" ${isNow ? "disabled style='opacity:.3'" : ""} aria-label="Next month">${ICON.right}</button></div>
    <p class="summary" style="text-align:center;margin:-6px 0 0">${finishedCount} ${finishedCount === 1 ? "book" : "books"} finished · ${daysRead} ${daysRead === 1 ? "day" : "days"} read</p>
    <div class="cal"><div class="wk"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="grid">${cells}</div></div>
    ${seen.size ? `<div class="legend">${[...seen.values()].map(b => `<button class="entry" data-open="${b.id}"><i style="background:${colorOf(b)}"></i><span><b style="font-family:var(--f-display);font-weight:600">${esc(b.title)}</b> <span class="muted" style="font-size:13px">· ${esc(authorStr(b))}</span></span></button>`).join("")}</div>`
      : `<p class="muted" style="text-align:center;font-size:14px">Tap any past day to add what you read.</p>`}
  </div>`;
}

/* ================= sheets ================= */
const sheet = $("#sheet"), backdrop = $("#backdrop");
let onClose = null;
function openSheet(html, closeCb) {
  sheet.innerHTML = `<div class="grab"></div>` + html;
  sheet.hidden = false; backdrop.hidden = false; onClose = closeCb || null;
  requestAnimationFrame(() => { sheet.classList.add("on"); backdrop.classList.add("on"); });
  sheet.scrollTop = 0;
}
function closeSheet() {
  sheet.classList.remove("on"); backdrop.classList.remove("on");
  document.documentElement.classList.remove("ritual");
  const cb = onClose; onClose = null;
  setTimeout(() => { sheet.hidden = true; backdrop.hidden = true; }, 320);
  if (cb) cb();
}
backdrop.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

function flyFrom(rect) {
  const cv = $(".fly", sheet); if (!cv || !rect || !cv.animate) return;
  const c = cv.getBoundingClientRect();
  const s = rect.height / c.height;
  cv.animate([
    { transform: `translate(${rect.left + rect.width/2 - (c.left + c.width/2)}px, ${rect.top + rect.height/2 - (c.top + c.height/2)}px) scale(${s}) rotateY(70deg)`, opacity: .7 },
    { transform: "none", opacity: 1 }
  ], { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)" });
}

function pullSheet(b, rect, el) {
  const kind = b.status;
  const why = b.why ? `<div class="why-slip"><span class="stamp">Why I picked this up</span>${esc(b.why)}</div>` : "";
  const facts = [b.year, b.pages ? b.pages + " pages" : null].filter(Boolean).join(" · ");
  openSheet(`<div class="stack center" style="perspective:900px">
      <div class="fly">${coverHTML(b, "l")}</div>
      <div><h2>${esc(b.title)}</h2><p class="sub" style="margin:2px 0 0">${esc(authorStr(b))}${facts ? " · " + esc(facts) : ""}</p></div>
      ${why}
      ${kind === "aside" ? `<p class="sub" style="margin:0">Set aside${cur(b) ? " after starting on " + fmt(cur(b).start) : ""}.</p>` : ""}
      <div class="btns" style="width:100%"><button class="btn primary" data-act="start" data-id="${b.id}">${kind === "aside" ? "Pick back up" : "Start reading"}</button><button class="btn" data-act="close">Back to shelf</button></div>
      ${!b.why && kind === "want" ? `<button class="btn quiet small" data-act="edit-why" data-id="${b.id}">Add why you picked this up</button>` : ""}
      <button class="btn quiet small" data-act="remove" data-id="${b.id}" style="color:var(--ink-3)">Remove from library</button>
    </div>`, () => el && el.classList.remove("pulling"));
  flyFrom(rect);
}

function currentSheet(b) {
  const r = cur(b);
  const logged = r && r.days.some(d => d.date === today());
  openSheet(`<div class="stack">
    <div class="bc-head">${coverHTML(b, "m")}<div class="meta"><span class="stamp" style="color:var(--terra)">On the table · Day ${diff(r.start, today()) + 1}</span><h2>${esc(b.title)}</h2><p class="sub" style="margin:0">${esc(authorStr(b))}</p></div></div>
    <div class="actions">
      <button class="action" data-act="toggle-today" data-id="${b.id}">${ICON.day}${logged ? "Read today ✓" : "Log today"}<small>${logged ? "Tap to remove today" : "Add today to your log"}</small></button>
      <button class="action" data-act="note" data-id="${b.id}">${ICON.pen}Add a note<small>A thought for later</small></button>
      <button class="action" data-act="quote" data-id="${b.id}">${ICON.quote}Keep a quote<small>Words worth keeping</small></button>
      <button class="action" data-act="finish" data-id="${b.id}">${ICON.check}I finished it<small>Place it on the shelf</small></button>
      <button class="action" data-act="aside" data-id="${b.id}">${ICON.pause}Set aside for now<small>Pause without guilt</small></button>
      <button class="action" data-act="card" data-id="${b.id}">${ICON.book}Book card<small>Dates, notes, history</small></button>
    </div></div>`);
}

function bookCard(b, ri, rect) {
  const reads = b.readings;
  ri = ri == null ? reads.length - 1 : ri;
  const r = reads[ri];
  let datesLine = "", dots = "";
  if (r) {
    const end = r.end || today();
    const span = diff(r.start, end) + 1;
    const set = new Set(r.days.map(d => d.date));
    datesLine = `<div class="dates">Started ${fmt(r.start)} → ${r.end ? "Finished " + fmt(r.end) : "still reading"}</div><div class="sub" style="font-size:13px">${span} ${span === 1 ? "day" : "days"}, read on ${r.days.length} of them</div>`;
    if (span <= 120) { let x = parse(r.start); const out = []; for (let i = 0; i < span; i++) { out.push(`<i class="${set.has(iso(x)) ? "on" : ""}" title="${fmt(iso(x))}"></i>`); x.setDate(x.getDate()+1); } dots = `<div class="dots">${out.join("")}</div>`; }
  }
  const thoughts = r ? r.days.filter(d => d.thought) : [];
  const hist = reads.map((x, i) => `<div class="hist"><span class="stamp">Read ${i + 1}${x.end ? " · " + MONTH[parse(x.end).getMonth()] + " " + parse(x.end).getFullYear() : " · in progress"}</span>
      <div class="row2"><label class="field"><span class="stamp" style="color:var(--ink-2)">Started</span><input type="date" id="rs-${i}" value="${x.start}" max="${today()}" data-rdate="${i}" data-which="start" data-id="${b.id}"></label>
      <label class="field"><span class="stamp" style="color:var(--ink-2)">Finished</span><input type="date" id="re-${i}" value="${x.end || ""}" max="${today()}" ${x.end ? "" : "disabled"} data-rdate="${i}" data-which="end" data-id="${b.id}"></label></div>
      ${x.closing ? `<p class="q" style="margin:0">${esc(x.closing)}</p>` : ""}</div>`).join("");
  openSheet(`<div class="stack">
    <div class="bc-head"><div class="fly">${coverHTML(b, "l")}</div><div class="meta"><h2>${esc(b.title)}</h2><p class="sub" style="margin:2px 0 8px">${esc(authorStr(b))}${b.pages ? " · " + b.pages + " pages" : ""}</p>${datesLine}</div></div>
    ${dots}
    <div class="sec"><h3>Why I picked this up</h3>${b.why ? `<p>${esc(b.why)}</p>` : `<button class="btn quiet small" style="align-self:flex-start;padding-left:0" data-act="edit-why" data-id="${b.id}">Add a line</button>`}</div>
    ${r && r.closing ? `<div class="sec"><h3>Closing line</h3><p class="q">${esc(r.closing)}</p></div>` : ""}
    <div class="sec"><h3>Quotes I kept</h3>${b.quotes.length ? `<div class="list">${b.quotes.map((q, i) => `<div class="entry"><p class="q">“${esc(q.text)}”</p><button class="x" data-del="quote" data-i="${i}" data-id="${b.id}" aria-label="Delete quote">×</button></div>`).join("")}</div>` : ""}<button class="btn quiet small" style="align-self:flex-start;padding-left:0" data-act="quote" data-id="${b.id}">+ Keep a quote</button></div>
    <div class="sec"><h3>Notes</h3>${(b.notes.length || thoughts.length) ? `<div class="list">${b.notes.map((n, i) => `<div class="entry"><p><span class="stamp muted">${fmt(n.date)}</span> ${esc(n.text)}</p><button class="x" data-del="note" data-i="${i}" data-id="${b.id}" aria-label="Delete note">×</button></div>`).join("")}${thoughts.map(t => `<div class="entry"><p><span class="stamp muted">${fmt(t.date)}</span> ${esc(t.thought)}${t.page ? ` <span class="muted">(p. ${esc(t.page)})</span>` : ""}</p></div>`).join("")}</div>` : ""}<button class="btn quiet small" style="align-self:flex-start;padding-left:0" data-act="note" data-id="${b.id}">+ Add a note</button></div>
    ${reads.length ? `<div class="sec"><h3>Reading history</h3>${hist}</div>` : ""}
    <div class="btns">${b.status === "finished" ? `<button class="btn primary" data-act="reread" data-id="${b.id}">Read again</button>` : b.status === "reading" ? `<button class="btn primary" data-act="finish" data-id="${b.id}">I finished it</button>` : `<button class="btn primary" data-act="start" data-id="${b.id}">Start reading</button>`}<button class="btn" data-act="close">Close</button></div>
    <button class="btn quiet small" data-act="remove" data-id="${b.id}" style="color:var(--ink-3)">Remove from library</button>
  </div>`);
  flyFrom(rect);
}

function textSheet(title, label, placeholder, onSave, extra = "") {
  openSheet(`<form class="stack" id="txtForm"><h2>${esc(title)}</h2>${extra}<label class="field"><span>${esc(label)}</span><textarea id="txt" placeholder="${esc(placeholder)}" maxlength="1200"></textarea></label>
    <div class="btns"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  const f = $("#txtForm"); setTimeout(() => $("#txt")?.focus(), 350);
  f.addEventListener("submit", e => { e.preventDefault(); const v = $("#txt").value.trim(); if (v) onSave(v); });
}

function finishSheet(b) {
  document.documentElement.classList.add("ritual");
  const sel = { color: colorOf(b) };
  const m = MONTH[new Date().getMonth()];
  openSheet(`<form class="stack" id="finForm">
    <div class="stack center"><div class="fly">${coverHTML(b, "m")}</div><span class="stamp" style="color:var(--terra)">A quiet moment</span><h2>You finished ${esc(b.title)}</h2><p class="sub" style="margin:0">by ${esc(authorStr(b))}. Everything below is optional.</p></div>
    <label class="field"><span>A closing line</span><textarea id="fin-close" placeholder="One sentence about the book, or about where you were while reading it"></textarea></label>
    <label class="field"><span>A quote to keep</span><textarea id="fin-quote" placeholder="Words you want to remember"></textarea></label>
    <div class="field"><label>Pick this book's color</label><div class="swatches" id="sws">${PALETTE.map(c => `<button type="button" class="sw ${c === sel.color ? "sel" : ""}" data-sw="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div></div>
    <label class="field"><span>Finished on</span><input type="date" id="fin-date" value="${today()}" max="${today()}" min="${cur(b).start}"></label>
    <button class="btn terra" type="submit" id="finBtn">Place on the ${m} shelf</button>
    <button class="btn quiet" type="button" data-act="close">Not yet</button></form>`);
  $("#sws").addEventListener("click", e => { const t = e.target.closest("[data-sw]"); if (!t) return; sel.color = t.dataset.sw; document.querySelectorAll("#sws .sw").forEach(s => s.classList.toggle("sel", s === t)); });

/* ================= search ================= */
async function googleBooks(q) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
  try {
    let key = ""; try { key = localStorage.getItem("balcony-gbooks-key") || ""; } catch {}
    const res = await fetch("https://www.googleapis.com/books/v1/volumes?printType=books&maxResults=12&q=" + encodeURIComponent(q) + (key ? "&key=" + encodeURIComponent(key) : ""), { signal: ctl.signal });
    if (!res.ok) throw new Error("http " + res.status);
    const j = await res.json();
    return (j.items || []).map(it => { const v = it.volumeInfo || {}; return {
      gid: it.id, title: v.title + (v.subtitle && v.title.length < 30 ? ": " + v.subtitle : ""), authors: v.authors || [], year: v.publishedDate ? parseInt(v.publishedDate) : null,
      pages: v.pageCount || null, thumb: v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || "").replace("http://", "https://").replace("&edge=curl", "") : null,
      blurb: v.description ? v.description.replace(/<[^>]+>/g, "").slice(0, 160) : "" }; }).filter(r => r.title && r.title !== "undefined");
  } finally { clearTimeout(t); }
}
async function openLibrary(q) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
  try {
    const res = await fetch("https://openlibrary.org/search.json?limit=12&fields=key,title,subtitle,author_name,first_publish_year,number_of_pages_median,cover_i&q=" + encodeURIComponent(q), { signal: ctl.signal });
    if (!res.ok) throw new Error("http " + res.status);
    const j = await res.json();
    return (j.docs || []).filter(d => d.title).map(d => ({ gid: "ol:" + d.key, title: d.title, authors: d.author_name || [], year: d.first_publish_year || null,
      pages: d.number_of_pages_median || null, thumb: d.cover_i ? "https://covers.openlibrary.org/b/id/" + d.cover_i + "-M.jpg" : null, blurb: "" }));
  } finally { clearTimeout(t); }
}
async function claudeBooks(q) {
  const sample = await use("sample");
  if (!sample) throw new Error("none");
  const data = await sample.json(`You are a careful book catalogue. List up to 6 real, published books that best match this search: "${q.replace(/"/g, "'")}".
Reply with ONLY a JSON array. Each item: {"title": string, "authors": [string], "year": number or null (first publication), "pages": number or null (common English paperback), "blurb": string (at most 20 words, no spoilers)}.
Use null when unsure. Never invent a book.`, { modelTier: "quick" });
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.books) ? data.books : []);
  return arr.filter(x => x && x.title).map(x => ({ title: String(x.title), authors: Array.isArray(x.authors) ? x.authors.map(String) : [], year: x.year || null, pages: x.pages || null, blurb: x.blurb || "", gid: null, thumb: null }));
}
async function runSearch(q) {
  S.query = q; S.searching = true; S.searchError = ""; S.results = null; render();
  try {
    S.results = await googleBooks(q); S.source = "Results from Google Books";
  } catch (e) {
    try { S.results = await openLibrary(q); S.source = "Google Books is busy right now, so these come from Open Library."; }
    catch (e1) {
    try { S.results = await claudeBooks(q); S.source = "Google Books couldn't be reached from here, so Claude suggested these. Check the details before adding."; }
    catch (e2) { S.searchError = e2 && e2.code === "not_granted" ? "Search needs permission to ask Claude when Google Books can't be reached. You can still add a book by hand." : "Couldn't reach Google Books or Open Library right now. Check your connection and try again, or add the book by hand."; }
    }
  }
  S.searching = false; render();
  const qi = $("#q"); qi && qi.blur();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("button, [data-open]"); if (!el) return;
  const d = el.dataset;

  if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); if (d.tab === "search") setTimeout(() => !S.results && $("#q")?.focus(), 50); return; }
  if (d.year !== undefined && el.closest(".yearpick")) { if (d.year) { S.year = +d.year; render(); } return; }
  if (d.cal) { let { y, m } = S.cal; m += +d.cal; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; render(); return; }
  if (d.day) { daySheet(d.day); return; }
  if (d.month != null && el.classList.contains("plate")) { monthSheet(+d.month); return; }
  if (d.cardYear) { libraryCard(+d.cardYear); return; }
  if (d.sw) return;

  if (d.spine) {
    const b = find(d.spine); if (!b) return;
    if (d.kind === "fin") { bookCard(b, +d.ri, el.getBoundingClientRect()); return; }
    el.classList.add("pulling");
    setTimeout(() => pullSheet(b, el.getBoundingClientRect(), el), 230);
    return;
  }
  if (d.current) { const b = find(d.current); b && currentSheet(b); return; }
  if (d.open) { const b = find(d.open); b && bookCard(b, d.ri != null ? +d.ri : null); return; }
  if (d.add != null) {
    const r = S.results[+d.add]; const b = newBook(r, d.as);
    addBook(b, d.as); return;
  }
  if (d.del) { const b = find(d.id); if (!b) return; (d.del === "quote" ? b.quotes : b.notes).splice(+d.i, 1); save(b); bookCard(b); return; }

  const b = d.id ? find(d.id) : null;
  switch (d.act) {
    case "close": closeSheet(); break;
    case "go-search": S.tab = "search"; render(); break;
    case "sample": S.sample = true; S.books = sampleBooks(); render(); break;
    case "clear-sample": S.sample = false; S.books = local.read() || []; render(); break;
    case "manual": manualSheet(); break;
    case "start": {
      if (!b) break;
      if (b.status === "aside" && cur(b)) b.status = "reading"; else startReading(b);
      save(b); closeSheet(); S.tab = "library"; render();
      toast(b.readings.length > 1 && !cur(b)?.days.length ? "Back on the table" : "On the table. Enjoy it.");
      break; }
    case "reread": if (!b) break; startReading(b); save(b); closeSheet(); render(); toast("Read " + b.readings.length + " begins today"); break;
    case "aside": if (!b) break; b.status = "aside"; save(b); closeSheet(); render(); toast("Set aside, safe on the top shelf"); break;
    case "finish": if (b) finishSheet(b); break;
    case "card": if (b) bookCard(b); break;
    case "toggle-today": {
      if (!b) break; const r = cur(b); const on = !r.days.some(x => x.date === today());
      logDay(b, today(), on); save(b); closeSheet(); render(); toast(on ? "Today is in your log" : "Removed today"); break; }
    case "read-today": {
      const reading = byStatus("reading");
      if (reading.length === 1) { const bb = reading[0]; const on = !cur(bb).days.some(x => x.date === today()); logDay(bb, today(), on); save(bb); render(); toast(on ? "Today is in your log" : "Removed today"); }
      else daySheet(today());
      break; }
    case "note": if (b) textSheet("A note on " + b.title, "Note", "What stayed with you?", v => { b.notes.push({ date: today(), text: v }); save(b); bookCard(b); toast("Note kept"); }); break;
    case "quote": if (b) textSheet("Keep a quote", "From " + b.title, "Type the words you want to remember", v => { b.quotes.push({ date: today(), text: v }); save(b); bookCard(b); toast("Quote kept"); }); break;
    case "edit-why": if (b) whySheet(b, () => render()); break;
    case "remove": {
      if (!b) break;
      if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Tap again to remove for good"; el.style.color = "var(--terra)"; break; }
      S.books = S.books.filter(x => x.id !== b.id); store.del(b.id); closeSheet(); render(); toast("Removed"); break; }
    case "save-card": { const y = +d.year; const blob = await cardImage(y); if (blob) offerFile(`balcony-library-${y}.png`, blob); break; }
    case "export": { const blob = new Blob([JSON.stringify({ app: "balcony-library", version: 1, exported: new Date().toISOString(), books: S.books }, null, 2)], { type: "application/json" }); offerFile(`balcony-library-backup-${today()}.json`, blob); break; }
    case "import": $("#importFile").click(); break;
    case "save-key": { const v = ($("#gkey")?.value || "").trim(); try { v ? localStorage.setItem("balcony-gbooks-key", v) : localStorage.removeItem("balcony-gbooks-key"); } catch {} toast(v ? "Key saved on this phone" : "Key removed"); break; }
  }
});
$("#menuBtn").addEventListener("click", menuSheet);

document.addEventListener("visibilitychange", () => { document.body.classList.toggle("paused", document.hidden); if (!document.hidden) render(); });
setInterval(() => { if (S.tab === "library" && sheet.hidden) { const c = document.querySelector(".timechip .stamp"); if (c) c.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + " · Marine Drive"; setTod(); } }, 30000);

render();
store.init();
})();
</script>
</body></html>
